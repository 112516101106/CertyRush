name: Update public catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: update-public-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate catalog Markdown and Data
        run: |
          npm run catalog:generate

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- README.md data/; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          # If CATALOG.md exists and is removed, we should commit the removal too.
          git add CATALOG.md || true
          git commit -m "chore: update public catalog and data"
          git push
